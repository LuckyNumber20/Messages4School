<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <style>
        body {
            background-color: #050505;
            color: #dcdcdc;
            font-family: 'Segoe UI', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .panel {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            height: 85vh;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .panel-head {
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #00ffcc;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-area {
            flex-grow: 1;
            background: #000;
            border: 1px solid #333;
            overflow-y: auto;
            padding: 8px;
            font-size: 0.75rem;
            color: #00ffcc;
            font-family: 'Consolas', monospace;
        }

        /* Message layout */
        .msg {
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 4px;
            padding-bottom: 4px;
            word-wrap: break-word;
        }
        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }
        .timestamp {
            color: #3a3a3a;
            font-size: 0.62rem;
            flex-shrink: 0;
        }
        .msg-body { margin-top: 2px; }

        /* File / image attachments */
        .msg-img {
            max-width: 220px;
            max-height: 160px;
            margin-top: 4px;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            display: block;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .msg-img:hover { border-color: #00ffcc; }
        .msg-file {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
            padding: 4px 10px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            color: #888;
            text-decoration: none;
            font-size: 0.72rem;
            transition: border-color 0.15s, color 0.15s;
        }
        .msg-file:hover { border-color: #00ffcc; color: #00ffcc; }

        /* Input row */
        .input-row {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            align-items: center;
        }
        .attach-btn {
            background: #111;
            border: 1px solid #333;
            color: #555;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            border-radius: 2px;
            flex-shrink: 0;
            line-height: 1;
            transition: color 0.15s, border-color 0.15s;
        }
        .attach-btn:hover { color: #00ffcc; border-color: #00ffcc; }

        /* Misc */
        .hidden { display: none !important; }
        .nav-tabs { border-bottom: 1px solid #333; margin-bottom: 10px; }
        .nav-link { color: #888; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; }
        .nav-link.active { color: #00ffcc; border-bottom: 2px solid #00ffcc; }
        .contacts-sidebar { max-height: 140px; overflow-y: auto; border: 1px solid #333; margin-bottom: 10px; padding: 5px; background: #0a0a0a; }
        .contact-item { cursor: pointer; padding: 3px 5px; font-size: 0.72rem; border-bottom: 1px solid #1a1a1a; }
        .contact-item:hover { background: #222; color: #00ffcc; }
        .mod-badge {
            font-size: 0.55rem;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 1px 5px;
            border-radius: 2px;
            margin-left: 6px;
            vertical-align: middle;
            letter-spacing: 0.5px;
            opacity: 0.75;
        }
    </style>
</head>
<body>

<div id="authPanel" class="panel">
    <div class="panel-head">Login</div>
    <div class="mb-3">
        <label class="form-label text-white" style="font-size: 0.8rem;">Email</label>
        <input type="email" id="emailInput" class="form-control bg-dark text-white">
    </div>
    <div class="mb-3">
        <label class="form-label text-white" style="font-size: 0.8rem;">Password</label>
        <input type="password" id="passInput" class="form-control bg-dark text-white">
    </div>
    <button class="btn btn-success btn-sm w-100 mb-2" onclick="login()">LOGIN</button>
    <button class="btn btn-outline-info btn-sm w-100" onclick="register()">REGISTER</button>
</div>

<div id="mainPanel" class="panel hidden">
    <div class="panel-head">
        <span>Radio <span class="mod-badge">MODERATED</span></span>
        <span id="myFriendCode" style="color: #888; font-size: 0.7rem;">Loading...</span>
        <button class="btn btn-danger btn-sm" style="font-size: 0.6rem; padding: 0 4px;" onclick="logout()">LOGOUT</button>
    </div>

    <div class="d-flex nav-tabs">
        <div class="nav-link active" id="tab-freq" onclick="switchTab('freq')">RADIO</div>
        <div class="nav-link"        id="tab-dm"   onclick="switchTab('dm')">DM / GROUPS</div>
    </div>

    <div id="freqControls" class="mb-2">
        <div class="input-group input-group-sm">
            <input type="text" id="freqInput" class="form-control bg-dark text-white" placeholder="Frequency Channel">
            <button class="btn btn-success" onclick="joinFreq()">JOIN</button>
        </div>
    </div>

    <div id="dmControls" class="hidden mb-2">
        <div class="input-group input-group-sm mb-2">
            <input type="text" id="friendCodeInput" class="form-control bg-dark text-white" placeholder="Friend Code">
            <button class="btn btn-info" onclick="addFriend()">ADD CONTACT</button>
        </div>
        <div class="input-group input-group-sm mb-2">
            <input type="text" id="groupNameInput" class="form-control bg-dark text-white" placeholder="Group Name">
            <button class="btn btn-warning" onclick="createGroup()">CREATE GROUP</button>
        </div>
        <div class="input-group input-group-sm mb-2">
    <input type="text" id="friendCodeInput" class="form-control bg-dark text-white" placeholder="Friend Code">
    <input type="text" id="friendNicknameInput" class="form-control bg-dark text-white" placeholder="Nickname (Optional)">
    <button class="btn btn-info" onclick="addFriend()">ADD CONTACT</button>
</div>
        <div class="contacts-sidebar text-white" id="contactsList">
            <div class="text-muted">No contacts or groups found.</div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="text-warning" style="font-size: 0.7rem;" id="activeDMDisplay">No target selected.</span>
            <button id="videoCallBtn" class="btn btn-outline-success btn-sm hidden" style="font-size: 0.65rem; padding: 1px 6px;" onclick="startVideoCall()">📹 CALL</button>
        </div>
    </div>

    <div id="chatBox" class="chat-area"></div>

    <input type="file" id="fileInput" class="hidden" onchange="sendFile(this)">
    <div class="input-row">
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">📎</button>
        <input type="text" id="msgInput" class="form-control form-control-sm bg-dark text-white"
               placeholder="Message..." onkeydown="if(event.key==='Enter') sendMessage()" style="flex:1">
    </div>
</div>

<div id="videoModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <div style="position: relative; width: 85%; max-width: 600px;">
        <video id="remoteVideo" autoplay playsinline style="width: 100%; height: 350px; border: 1px solid #00ffcc; background: #000; border-radius: 4px; object-fit: cover;"></video>
        <video id="localVideo" autoplay playsinline muted style="width: 130px; height: 90px; position: absolute; bottom: 10px; right: 10px; border: 1px solid #fff; border-radius: 4px; background: #222; object-fit: cover;"></video>
    </div>
    <button class="btn btn-danger btn-sm mt-3" onclick="endVideoCall()">END CALL</button>
</div>

<script>
    // APPWRITE CONFIGURATION
    const { Client, Account, Databases, Storage, ID, Query } = Appwrite;
    const client = new Client()
        .setEndpoint('https://nyc.cloud.appwrite.io/v1')
        .setProject('6a64f37300151ccefd0f');

    const account   = new Account(client);
    const databases = new Databases(client);
    const storage   = new Storage(client);

    const DB_ID               = '6a64f4430013964a8413';
    const MSG_COLLECTION      = 'messages';
    const CONTACTS_COLLECTION = 'contacts';
    const GROUPS_COLLECTION   = 'groups';     // Create this collection in Console
    const SIGNAL_COLLECTION   = 'signaling';  // Create this collection in Console
    const BUCKET_ID           = 'YOUR_BUCKET_ID';

    const MAX_FILE_MB   = 10;
    const MAX_FILE_SIZE = MAX_FILE_MB * 1024 * 1024;

    // SIGHTENGINE CONFIGURATION
    const SE_USER   = '1290337523';
    const SE_SECRET = 'DJDFYB4t4wtYLf6RtWfKXvJRNe2ZC5z3';

    // STATE
    let currentUser           = null;
    let currentMode           = 'freq';
    let activeTargetType      = null; // 'user' or 'group'
    let activeDMTarget        = null;
    let activeGroupId         = null;
    let dmRealtimeUnsubscribe = null;
    let freq                  = "";
    let lastTime              = 0;
    let pollInterval          = null;

    // WEBRTC STATE
    let localStream           = null;
    let peerConnection        = null;
    let signalRealtimeUnsub   = null;
    const rtcConfig           = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // UTILITIES
    function formatTime(date) {
        return new Date(date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function getFileUrl(fileId, mode = 'view') {
        return `https://nyc.cloud.appwrite.io/v1/storage/buckets/${BUCKET_ID}/files/${fileId}/${mode}?project=6a64f37300151ccefd0f`;
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // MODERATION
    async function checkContent(text) {
        try {
            const params = new URLSearchParams({
                text:       text,
                lang:       'en',
                mode:       'standard',
                api_user:   SE_USER,
                api_secret: SE_SECRET
            });
            const res  = await fetch(`https://api.sightengine.com/1.0/text/check.json?${params}`);
            const data = await res.json();

            if (data.status !== 'success') return { flagged: false, reasons: [] };

            const reasons = [];
            if (data.profanity?.matches?.length > 0) reasons.push(`profanity`);
            if (data.drug?.matches?.length > 0) reasons.push(`drug references`);
            if (data.weapon?.matches?.length > 0) reasons.push(`weapon references`);

            return { flagged: reasons.length > 0, reasons };
        } catch (e) {
            return { flagged: false, reasons: [] };
        }
    }

    // INITIALIZATION
    window.onload = async () => {
        try {
            currentUser = await account.get();
            showMainPanel();
        } catch (e) {
            document.getElementById('authPanel').classList.remove('hidden');
        }
    };

    // AUTHENTICATION
    async function register() {
        const email = document.getElementById('emailInput').value;
        const pass  = document.getElementById('passInput').value;
        try {
            await account.create(ID.unique(), email, pass);
            await login();
        } catch (e) { alert("Registration failed."); console.error(e); }
    }

    async function login() {
        const email = document.getElementById('emailInput').value;
        const pass  = document.getElementById('passInput').value;
        try {
            await account.createEmailSession(email, pass);
            currentUser = await account.get();
            showMainPanel();
        } catch (e) { alert("Login failed: " + e.message); console.error(e); }
    }

    async function logout() {
        await account.deleteSession('current');
        location.reload();
    }

    function showMainPanel() {
        document.getElementById('authPanel').classList.add('hidden');
        document.getElementById('mainPanel').classList.remove('hidden');
        document.getElementById('myFriendCode').innerText = `Code: ${currentUser.$id}`;
        loadContactsAndGroups();
        initSignalingListener();
    }

    // UI TABS
    function switchTab(mode) {
        currentMode = mode;
        document.getElementById('tab-freq').classList.toggle('active', mode === 'freq');
        document.getElementById('tab-dm').classList.toggle('active', mode === 'dm');
        document.getElementById('freqControls').classList.toggle('hidden', mode !== 'freq');
        document.getElementById('dmControls').classList.toggle('hidden', mode !== 'dm');
        document.getElementById('chatBox').innerHTML = "";

        if (mode === 'dm') {
            if (pollInterval) clearInterval(pollInterval);
            addChat("SYS", "Select a contact or group to begin.");
        } else {
            if (dmRealtimeUnsubscribe) { dmRealtimeUnsubscribe(); dmRealtimeUnsubscribe = null; }
            addChat("SYS", "Switched to Public Frequency mode.");
        }
    }

    // FREQUENCY MODE
    function joinFreq() {
        freq = document.getElementById('freqInput').value.trim();
        if (freq) {
            document.getElementById('chatBox').innerHTML = "";
            addChat("SYS", `Connecting to frequency: ${freq}...`);
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(poll, 2000);
            transmit("ALIVE");
        }
    }

    async function transmit(msg) {
        if (freq) {
            const user = currentUser.email.split('@')[0];
            await fetch(`https://ntfy.sh/${freq}`, { method: 'POST', body: `${user}||${msg}` });
        }
    }

    async function poll() {
        if (!freq || currentMode !== 'freq') return;
        try {
            const res  = await fetch(`https://ntfy.sh/${freq}/json?poll=1&since=${lastTime === 0 ? 'all' : lastTime}`);
            const data = await res.text();
            for (const line of data.trim().split('\n')) {
                if (!line) continue;
                const j = JSON.parse(line);
                if (j.time > lastTime) {
                    lastTime = j.time;
                    await handlePacket(j.message);
                }
            }
        } catch (error) { console.error("Signal lost:", error); }
    }

    async function handlePacket(raw) {
        if (!raw.includes("||")) return;
        const [sender, msg] = raw.split("||");
        const me = currentUser.email.split('@')[0];
        if (sender === me) return;

        const cmd = msg.split("::");
        if (cmd[0] === "CHAT") {
            const check = await checkContent(cmd[1]);
            if (check.flagged) {
                addChat("SYS", `⚠️ Message blocked — ${check.reasons.join('; ')}`);
                return;
            }
            addChat(sender, cmd[1]);
        } else if (cmd[0] === "FILE") {
            const [, fileId, fileName, mimeType] = cmd;
            const payload = `__FILE__${JSON.stringify({ id: fileId, name: fileName, type: mimeType })}`;
            addChat(sender, payload);
        } else if (msg === "ALIVE") {
            addChat("SYS", `[${sender}] joined the frequency.`);
        }
    }

    // DM & GROUPS LOGIC
    // Add contact with custom nickname support
async function addFriend() {
    const code = document.getElementById('friendCodeInput').value.trim();
    const customNickname = document.getElementById('friendNicknameInput').value.trim();

    if (!code || code === currentUser.$id) return alert("Invalid code.");

    // Fall back to short ID if no nickname is entered
    const displayName = customNickname || `${code.substring(0, 4)}`;

    try {
        await databases.createDocument(DB_ID, CONTACTS_COLLECTION, ID.unique(), {
            userId:     currentUser.$id,
            friendId:   code,
            friendName: displayName
        });
        document.getElementById('friendCodeInput').value = "";
        document.getElementById('friendNicknameInput').value = "";
        loadContactsAndGroups();
    } catch (e) { alert("Failed to add contact: " + e.message); }
}

// Edit existing contact nickname
async function editNickname(docId, currentName) {
    const newName = prompt("Enter new nickname:", currentName);
    if (!newName || newName.trim() === "" || newName === currentName) return;

    try {
        await databases.updateDocument(DB_ID, CONTACTS_COLLECTION, docId, {
            friendName: newName.trim()
        });
        loadContactsAndGroups();
    } catch (e) { alert("Failed to update nickname: " + e.message); }
}

    async function createGroup() {
        const groupName = document.getElementById('groupNameInput').value.trim();
        if (!groupName) return alert("Enter a group name.");
        try {
            await databases.createDocument(DB_ID, GROUPS_COLLECTION, ID.unique(), {
                name: groupName,
                members: [currentUser.$id]
            });
            document.getElementById('groupNameInput').value = "";
            loadContactsAndGroups();
        } catch (e) { alert("Failed to create group: " + e.message); }
    }

    async function loadContactsAndGroups() {
    const list = document.getElementById('contactsList');
    list.innerHTML = "Loading...";

    try {
        const friendsRes = await databases.listDocuments(DB_ID, CONTACTS_COLLECTION);
        const groupsRes  = await databases.listDocuments(DB_ID, GROUPS_COLLECTION);

        list.innerHTML = "";

        const myContacts = friendsRes.documents.filter(doc => doc.userId === currentUser.$id);
        const myGroups   = groupsRes.documents.filter(doc => 
            Array.isArray(doc.members) ? doc.members.includes(currentUser.$id) : doc.members === currentUser.$id
        );

        if (myContacts.length === 0 && myGroups.length === 0) {
            list.innerHTML = "<div class='text-muted p-1'>No contacts or groups found.</div>";
            return;
        }

        // Render Contacts with Edit Nickname Pencil
        myContacts.forEach(doc => {
            const el = document.createElement('div');
            el.className = 'contact-item';
            el.style.display = 'flex';
            el.style.justifyContent = 'space-between';
            el.style.alignItems = 'center';
            el.style.width = '100%';

            const nameSpan = document.createElement('span');
            nameSpan.innerText = `👤 ${doc.friendName} (${doc.friendId.substring(0, 5)})`;
            nameSpan.style.flex = '1';
            nameSpan.style.overflow = 'hidden';
            nameSpan.style.textOverflow = 'ellipsis';
            nameSpan.style.whiteSpace = 'nowrap';
            nameSpan.onclick = () => openDM(doc.friendId, doc.friendName);

            const editBtn = document.createElement('span');
            editBtn.innerHTML = '✏️';
            editBtn.title = 'Edit Nickname';
            editBtn.style.cursor = 'pointer';
            editBtn.style.paddingLeft = '6px';
            editBtn.style.fontSize = '0.75rem';
            editBtn.onclick = (e) => {
                e.stopPropagation(); // Prevents opening the DM when clicking the icon
                editNickname(doc.$id, doc.friendName);
            };

            el.appendChild(nameSpan);
            el.appendChild(editBtn);
            list.appendChild(el);
        });

        // Render Groups
        // Render Groups with Add Member Button
myGroups.forEach(doc => {
    const el = document.createElement('div');
    el.className = 'contact-item';
    el.style.display = 'flex';
    el.style.justifyContent = 'space-between';
    el.style.alignItems = 'center';
    el.style.color = '#00ffcc';

    const nameSpan = document.createElement('span');
    nameSpan.innerText = `👥 [Group] ${doc.name}`;
    nameSpan.style.flex = '1';
    nameSpan.style.overflow = 'hidden';
    nameSpan.style.textOverflow = 'ellipsis';
    nameSpan.style.whiteSpace = 'nowrap';
    nameSpan.onclick = () => openGroup(doc.$id, doc.name);

    const addMemberBtn = document.createElement('span');
    addMemberBtn.innerHTML = '➕';
    addMemberBtn.title = 'Add Member';
    addMemberBtn.style.cursor = 'pointer';
    addMemberBtn.style.paddingLeft = '6px';
    addMemberBtn.style.fontSize = '0.75rem';
    addMemberBtn.onclick = (e) => {
        e.stopPropagation(); // Prevents opening the group when clicking the icon
        addUserToGroup(doc.$id, doc.name);
    };

    el.appendChild(nameSpan);
    el.appendChild(addMemberBtn);
    list.appendChild(el);
});

    } catch (e) {
        console.error("Diagnostic Error:", e);
        list.innerHTML = `<div class='text-danger p-1'>Error: ${e.message}</div>`;
    }
}

    async function openDM(targetId, targetName) {
        activeTargetType = 'user';
        activeDMTarget   = targetId;
        activeGroupId    = null;

        document.getElementById('activeDMDisplay').innerText = `Direct Chat: ${targetName}`;
        document.getElementById('videoCallBtn').classList.remove('hidden');
        document.getElementById('chatBox').innerHTML = "";

        try {
            const messages = await databases.listDocuments(DB_ID, MSG_COLLECTION, [
                Query.orderAsc('$createdAt'),
                Query.limit(50)
            ]);
            messages.documents.forEach(doc => {
                if ((doc.senderId === currentUser.$id && doc.receiverId === targetId) ||
                    (doc.senderId === targetId        && doc.receiverId === currentUser.$id)) {
                    addChat(doc.senderId === currentUser.$id ? "ME" : targetName, doc.text, doc.$createdAt);
                }
            });
        } catch (e) { console.error("Error fetching DMs", e); }

        if (dmRealtimeUnsubscribe) dmRealtimeUnsubscribe();
        dmRealtimeUnsubscribe = client.subscribe(
            `databases.${DB_ID}.collections.${MSG_COLLECTION}.documents`,
            response => {
                if (response.events.includes('databases.*.collections.*.documents.*.create')) {
                    const doc = response.payload;
                    if (doc.senderId === targetId && doc.receiverId === currentUser.$id) {
                        addChat(targetName, doc.text, doc.$createdAt);
                    }
                }
            }
        );
    }

    async function openGroup(groupId, groupName) {
        activeTargetType = 'group';
        activeGroupId    = groupId;
        activeDMTarget   = null;

        document.getElementById('activeDMDisplay').innerText = `Group: ${groupName}`;
        document.getElementById('videoCallBtn').classList.add('hidden');
        document.getElementById('chatBox').innerHTML = "";

        try {
            const messages = await databases.listDocuments(DB_ID, MSG_COLLECTION, [
                Query.equal('groupId', groupId),
                Query.orderAsc('$createdAt'),
                Query.limit(50)
            ]);
            messages.documents.forEach(doc => {
                addChat(doc.senderId === currentUser.$id ? "ME" : doc.senderId.substring(0, 5), doc.text, doc.$createdAt);
            });
        } catch (e) { console.error("Error fetching group messages", e); }

        if (dmRealtimeUnsubscribe) dmRealtimeUnsubscribe();
        dmRealtimeUnsubscribe = client.subscribe(
            `databases.${DB_ID}.collections.${MSG_COLLECTION}.documents`,
            response => {
                if (response.events.includes('databases.*.collections.*.documents.*.create')) {
                    const doc = response.payload;
                    if (doc.groupId === groupId && doc.senderId !== currentUser.$id) {
                        addChat(doc.senderId.substring(0, 5), doc.text, doc.$createdAt);
                    }
                }
            }
        );
    }

    // FILE ATTACHMENTS
    async function sendFile(input) {
        const file = input.files[0];
        if (!file) return;
        input.value = '';

        if (file.size > MAX_FILE_SIZE) return addChat("SYS", `⚠️ File too large — max ${MAX_FILE_MB} MB.`);

        addChat("SYS", `Uploading ${escapeHtml(file.name)}...`);

        try {
            const result  = await storage.createFile(BUCKET_ID, ID.unique(), file);
            const fileId  = result.$id;
            const payload = `__FILE__${JSON.stringify({ id: fileId, name: file.name, type: file.type })}`;

            if (currentMode === 'freq') {
                if (freq) {
                    await transmit(`FILE::${fileId}::${file.name}::${file.type}`);
                    addChat("ME", payload);
                }
            } else if (currentMode === 'dm') {
                if (activeTargetType === 'user' && activeDMTarget) {
                    await databases.createDocument(DB_ID, MSG_COLLECTION, ID.unique(), {
                        senderId: currentUser.$id,
                        receiverId: activeDMTarget,
                        text: payload
                    });
                    addChat("ME", payload);
                } else if (activeTargetType === 'group' && activeGroupId) {
                    await databases.createDocument(DB_ID, MSG_COLLECTION, ID.unique(), {
                        senderId: currentUser.$id,
                        groupId: activeGroupId,
                        text: payload
                    });
                    addChat("ME", payload);
                }
            }
        } catch (e) { addChat("SYS", `ERROR uploading: ${e.message}`); }
    }

    // SEND MESSAGE
    async function sendMessage() {
        const inputField = document.getElementById('msgInput');
        const v          = inputField.value.trim();
        if (!v) return;

        if (currentMode === 'freq') {
            if (freq) {
                const check = await checkContent(v);
                if (check.flagged) return addChat("SYS", `⚠️ Message blocked — ${check.reasons.join('; ')}`);
                await transmit(`CHAT::${v}`);
                addChat("ME", v);
                inputField.value = "";
            }
        } else if (currentMode === 'dm') {
            try {
                if (activeTargetType === 'user' && activeDMTarget) {
                    await databases.createDocument(DB_ID, MSG_COLLECTION, ID.unique(), {
                        senderId:   currentUser.$id,
                        receiverId: activeDMTarget,
                        text:       v
                    });
                    addChat("ME", v);
                    inputField.value = "";
                } else if (activeTargetType === 'group' && activeGroupId) {
                    await databases.createDocument(DB_ID, MSG_COLLECTION, ID.unique(), {
                        senderId: currentUser.$id,
                        groupId:  activeGroupId,
                        text:     v
                    });
                    addChat("ME", v);
                    inputField.value = "";
                }
            } catch (e) { addChat("SYS", "ERROR Sending: " + e.message); }
        }
    }

    // WEBRTC VIDEO CALLS
    async function startVideoCall() {
        if (!activeDMTarget) return alert("Select a friend to call.");
        document.getElementById('videoModal').classList.remove('hidden');

        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        setupPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await sendSignal('offer', JSON.stringify(offer));
    }

    function setupPeerConnection() {
        peerConnection = new RTCPeerConnection(rtcConfig);

        peerConnection.onicecandidate = event => {
            if (event.candidate) sendSignal('candidate', JSON.stringify(event.candidate));
        };

        peerConnection.ontrack = event => {
            document.getElementById('remoteVideo').srcObject = event.streams[0];
        };
    }

    async function sendSignal(type, payload) {
        await databases.createDocument(DB_ID, SIGNAL_COLLECTION, ID.unique(), {
            senderId: currentUser.$id,
            targetId: activeDMTarget,
            type: type,
            payload: payload
        });
    }

    function initSignalingListener() {
        signalRealtimeUnsub = client.subscribe(
            `databases.${DB_ID}.collections.${SIGNAL_COLLECTION}.documents`,
            async response => {
                if (response.events.includes('databases.*.collections.*.documents.*.create')) {
                    const signal = response.payload;
                    if (signal.targetId !== currentUser.$id) return;

                    const data = JSON.parse(signal.payload);

                    if (signal.type === 'offer') {
                        document.getElementById('videoModal').classList.remove('hidden');
                        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        document.getElementById('localVideo').srcObject = localStream;

                        setupPeerConnection();
                        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        await sendSignal('answer', JSON.stringify(answer));

                    } else if (signal.type === 'answer' && peerConnection) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                    } else if (signal.type === 'candidate' && peerConnection) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data));
                    }
                }
            }
        );
    }

    function endVideoCall() {
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        document.getElementById('videoModal').classList.add('hidden');
    }

    // CHAT RENDERER
    function addChat(user, text, isoTimestamp) {
        const box       = document.getElementById('chatBox');
        const isSys     = user === "SYS";
        const userStyle = isSys         ? "color: #ffcc00;"
                        : user === "ME" ? "color: #fff;"
                        :                  "color: #00ffcc;";
        const timeStr   = formatTime(isoTimestamp || new Date());

        let bodyHtml;
        if (!isSys && text.startsWith('__FILE__')) {
            try {
                const meta = JSON.parse(text.slice(8));
                if (meta.type && meta.type.startsWith('image/')) {
                    const viewUrl = getFileUrl(meta.id);
                    bodyHtml = `<a href="${viewUrl}" target="_blank" rel="noopener">
                                    <img class="msg-img" src="${viewUrl}" alt="${escapeHtml(meta.name)}">
                                </a>`;
                } else {
                    const dlUrl = getFileUrl(meta.id, 'download');
                    bodyHtml = `<a class="msg-file" href="${dlUrl}" target="_blank" rel="noopener">
                                    📄 ${escapeHtml(meta.name)}
                                </a>`;
                }
            } catch {
                bodyHtml = '<em style="color:#444">[Attachment]</em>';
            }
        } else {
            bodyHtml = escapeHtml(text);
        }

        box.innerHTML += `
            <div class="msg">
                <div class="msg-header">
                    <b style="${userStyle}">${escapeHtml(user)}</b>
                    <span class="timestamp">${timeStr}</span>
                </div>
                <div class="msg-body">${bodyHtml}</div>
            </div>`;
        box.scrollTop = box.scrollHeight;
    }
    async function addUserToGroup(groupId, groupName) {
    const friendId = prompt(`Enter Friend Code to add to "${groupName}":`);
    if (!friendId || !friendId.trim()) return;

    try {
        // 1. Fetch current group details
        const group = await databases.getDocument(DB_ID, GROUPS_COLLECTION, groupId);

        // 2. Prevent duplicates
        const currentMembers = Array.isArray(group.members) ? group.members : [group.members];
        if (currentMembers.includes(friendId.trim())) {
            return alert("User is already in this group.");
        }

        // 3. Update the members array in Appwrite
        const updatedMembers = [...currentMembers, friendId.trim()];
        await databases.updateDocument(DB_ID, GROUPS_COLLECTION, groupId, {
            members: updatedMembers
        });

        alert("User added successfully!");
        loadContactsAndGroups();
    } catch (e) {
        alert("Failed to add user: " + e.message);
    }
}
